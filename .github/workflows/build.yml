name: build

# Compiles every utility for both supported architectures and uploads one
# tarball per utility and architecture.
#
# This workflow is only ever called by another one (ci.yml), or run by hand.
# It stops at the per-utility trees deliberately: merging them into a publish-
# able bundle happens in ci.yml, after the test suite has passed.
#
# The utilities build independently, so they run as a matrix. Wall time is the
# slowest single build rather than the sum of them all.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # build-all.sh owns the list of utilities. Reading it here rather than
  # repeating it keeps adding a utility a one-line change in one file, as the
  # maintainer guide says it is.
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      utilities: ${{ steps.list.outputs.utilities }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          # -n matters: without it jq consumes the first line as its initial
          # input and `inputs` yields only the rest, silently dropping 7z.
          utilities="$(./build-all.sh --list utilities | jq -Rnc '[inputs]')"
          test "$(printf '%s' "${utilities}" | jq 'length')" -gt 0
          echo "utilities=${utilities}" >> "${GITHUB_OUTPUT}"
          echo "building: ${utilities}"

  build:
    name: build ${{ matrix.utility }} (${{ matrix.architecture }})
    runs-on: ${{ matrix.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    needs: prepare
    env:
      PLATFORM: ${{ matrix.architecture == 'aarch64' && 'linux/arm64' || 'linux/amd64' }}
    # git and OpenSSH run unusually large upstream suites. Raising the ceiling
    # for every utility would let a genuinely stuck build elsewhere burn that
    # time, so only those two get longer limits.
    timeout-minutes: ${{ (matrix.utility == 'git' && 300) || (matrix.utility == 'openssh-server' && 240) || 120 }}
    strategy:
      fail-fast: false
      matrix:
        utility: ${{ fromJSON(needs.prepare.outputs.utilities) }}
        architecture: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.utility }}
        run: |
          # wget's HTTPS test suite resolves a fixed hostname through glibc's
          # HOSTALIASES, which the musl-built client ignores; the mapping is
          # supplied through /etc/hosts, which musl reads, because the Dockerfile
          # cannot write /etc/hosts during a build. Harmless to other utilities.
          add_host=""
          [ "${{ matrix.utility }}" = wget ] && add_host="--add-host=WgetTestingServer:127.0.0.1"
          # The local exporter normalizes ownership and strips setuid bits.
          # Docker's tar exporter preserves the artifact filesystem metadata.
          docker build \
            ${add_host} \
            --platform "${PLATFORM}" \
            --target artifact \
            --output "type=tar,dest=${{ matrix.utility }}.tar" \
            "./${{ matrix.utility }}"

      - uses: actions/upload-artifact@v7
        with:
          name: stage-${{ matrix.architecture }}-${{ matrix.utility }}
          path: ${{ matrix.utility }}.tar
          retention-days: 1
          if-no-files-found: error
