name: build

# Compiles every utility and uploads one tarball per utility.
#
# This workflow is only ever called by another one (ci.yml), or run by hand.
# It stops at the per-utility trees deliberately: merging them into a publish-
# able bundle happens in ci.yml, after the test suite has passed.
#
# The utilities build independently, so they run as a matrix. Wall time is the
# slowest single build rather than the sum of them all.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLATFORM: linux/amd64

jobs:
  # build-all.sh owns the list of utilities. Reading it here rather than
  # repeating it keeps adding a utility a one-line change in one file, as the
  # maintainer guide says it is.
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      utilities: ${{ steps.list.outputs.utilities }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          # -n matters: without it jq consumes the first line as its initial
          # input and `inputs` yields only the rest, silently dropping 7z.
          utilities="$(./build-all.sh --list utilities | jq -Rnc '[inputs]')"
          test "$(printf '%s' "${utilities}" | jq 'length')" -gt 0
          echo "utilities=${utilities}" >> "${GITHUB_OUTPUT}"
          echo "building: ${utilities}"

  build:
    name: build ${{ matrix.utility }}
    runs-on: ubuntu-latest
    needs: prepare
    # git is the outlier: its own suite is over a thousand test files and runs
    # at half the processors, which on a hosted runner takes hours rather than
    # the minutes every other utility needs. Raising the ceiling for all of them
    # would mean a genuinely stuck build elsewhere burned that time before
    # failing, so only git gets the longer one.
    timeout-minutes: ${{ matrix.utility == 'git' && 300 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        utility: ${{ fromJSON(needs.prepare.outputs.utilities) }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.utility }}
        run: |
          mkdir -p "staging/${{ matrix.utility }}"
          # wget's HTTPS test suite resolves a fixed hostname through glibc's
          # HOSTALIASES, which the musl-built client ignores; the mapping is
          # supplied through /etc/hosts, which musl reads, because the Dockerfile
          # cannot write /etc/hosts during a build. Harmless to other utilities.
          add_host=""
          [ "${{ matrix.utility }}" = wget ] && add_host="--add-host=WgetTestingServer:127.0.0.1"
          docker build \
            ${add_host} \
            --platform "${PLATFORM}" \
            --target artifact \
            --output "type=local,dest=staging/${{ matrix.utility }}" \
            "./${{ matrix.utility }}"

      # Tar before uploading. upload-artifact resolves symlinks into duplicate
      # files and does not preserve the executable bit, and the artifact tree
      # relies on both: twelve of the twenty commands are symlinks.
      - name: Pack build output
        run: tar -cf "${{ matrix.utility }}.tar" -C "staging/${{ matrix.utility }}" .

      - uses: actions/upload-artifact@v7
        with:
          name: stage-${{ matrix.utility }}
          path: ${{ matrix.utility }}.tar
          retention-days: 1
          if-no-files-found: error
